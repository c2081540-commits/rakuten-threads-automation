name: One-shot Gemini Interior Policy Patch

on:
  push:
    paths:
      - '.github/workflows/patch-gemini-interior-policy-now.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python patch_gemini_interior_policy.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gemini.py
          git commit -m "Align Gemini generation with permanent interior niche"
          git pull --rebase origin main
          git push origin HEAD:main
