name: One-shot Interior Queue Validation

on:
  push:
    paths:
      - '.github/workflows/validate-interior-queue-now.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python validate_interior_queue.py
      - if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/interior_queue_validation.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record interior queue validation"
          git pull --rebase origin main
          git push origin HEAD:main
