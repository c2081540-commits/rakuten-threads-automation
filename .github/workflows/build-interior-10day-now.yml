name: One-shot Interior 10-day Queue Build

on:
  push:
    paths:
      - '.github/workflows/build-interior-10day-now.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - name: Build 50 interior posts and replace future queue
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5-mini' }}
        run: python build_interior_10day.py
      - name: Commit queue and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add queue.json data/interior_10day_report.json
          git commit -m "Replace future queue with interior 10-day test"
          git pull --rebase origin main
          git push origin HEAD:main
