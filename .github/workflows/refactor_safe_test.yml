name: Rakuten Refactor Safe Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safe-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4
        with:
          ref: refactor/content-separation

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pure scheduling tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Preview next daily stock without saving
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5-mini
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
        run: python main.py --mode stock-preview

      - name: Preview today's remaining replacement without saving
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5-mini
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
        run: python main.py --mode today-preview

      - name: Verify repository state was not changed
        run: |
          CHANGES="$(git status --porcelain --untracked-files=all | grep -vE '(^|/)(__pycache__|.*\.pyc)(/|$)' || true)"
          if [ -n "$CHANGES" ]; then
            echo 'ERROR: Safe test modified persistent repository files:'
            echo "$CHANGES"
            exit 1
          fi
          echo 'OK: queue/history/persistent repository files were not modified.'
