name: Rakuten Refactor Safe Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safe-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile all Python files
        run: python -m compileall -q .

      - name: Run scheduling smoke tests
        run: |
          python - <<'PY'
          from datetime import date
          from main import DAILY_HOURS, JST, _schedule_for_day, arrange_stock_posts

          slots = _schedule_for_day(date(2026, 8, 12))
          assert len(slots) == 5
          assert [x.hour for x in slots] == DAILY_HOURS
          assert all(x.tzinfo == JST for x in slots)

          posts = [{"post_id": f"E{i}", "type": "empathy"} for i in range(1, 4)]
          posts += [{"post_id": f"P{i}", "type": "product"} for i in range(1, 3)]
          arranged = arrange_stock_posts(posts)
          assert len(arranged) == 5
          assert sum(p["type"] == "empathy" for p in arranged) == 3
          assert sum(p["type"] == "product" for p in arranged) == 2
          print("OK: scheduling smoke tests passed")
          PY

      - name: Preview next daily stock without saving
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5-mini
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
        run: python main.py --mode stock-preview

      - name: Preview today's remaining replacement without saving
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5-mini
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
        run: python main.py --mode today-preview

      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Verify repository state was not changed
        run: |
          CHANGES="$(git status --porcelain --untracked-files=all | grep -vE '(^|/)(__pycache__|.*\.pyc)(/|$)' || true)"
          if [ -n "$CHANGES" ]; then
            echo 'ERROR: Safe test modified persistent repository files:'
            echo "$CHANGES"
            exit 1
          fi
          echo 'OK: queue/history/persistent repository files were not modified.'
