name: Threads Insights Refresh

on:
  workflow_dispatch:
    inputs:
      days:
        description: '取得対象の日数'
        required: true
        default: '30'
        type: string
      limit:
        description: '最大投稿数'
        required: true
        default: '200'
        type: string

concurrency:
  group: threads-insights-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect Threads post insights
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: |
          python insights.py \
            --days "${{ inputs.days }}" \
            --limit "${{ inputs.limit }}"

      - name: Commit insight snapshots
        run: |
          if git diff --quiet -- history.json; then
            echo "No insight changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.json
          git commit -m "Refresh Threads post insights"
          git pull --rebase origin main
          git push origin HEAD:main
