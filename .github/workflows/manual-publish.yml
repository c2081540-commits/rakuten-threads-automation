name: Rakuten Threads Manual Recovery Publish

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: '投稿予定日（YYYY-MM-DD）'
        required: true
        type: string
      target_hour:
        description: '投稿予定時刻'
        required: true
        default: '12'
        type: choice
        options:
          - '7'
          - '12'
          - '15'
          - '18'
          - '21'
      republish_posted:
        description: '投稿済み履歴から再投稿する'
        required: true
        default: false
        type: boolean
      confirm:
        description: '本当に投稿する場合は PUBLISH と入力'
        required: true
        type: string

concurrency:
  group: rakuten-threads-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    if: ${{ inputs.confirm == 'PUBLISH' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Publish selected queued or historical post
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: |
          EXTRA=""
          if [ "${{ inputs.republish_posted }}" = "true" ]; then
            EXTRA="--allow-history"
          fi
          python manual_publish.py --date "${{ inputs.target_date }}" --hour "${{ inputs.target_hour }}" $EXTRA

      - name: Save queue and history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add queue.json history.json
          if ! git diff --cached --quiet; then
            git commit -m "Record manual Rakuten Threads recovery publish"
            git push
          fi
