name: One-shot Furniture Candidate Refresh

on:
  push:
    paths:
      - '.github/workflows/refresh-interior-now.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - name: Refresh furniture candidates
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
        run: python fetch_candidates.py --target-count 80 --minimum-count 50 --output data/candidates/latest.json
      - name: Commit refreshed candidates
        run: |
          if [ -z "$(git status --porcelain -- data/candidates/latest.json)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/candidates/latest.json
          git commit -m "Refresh furniture candidate products"
          git pull --rebase origin main
          git push origin HEAD:main
