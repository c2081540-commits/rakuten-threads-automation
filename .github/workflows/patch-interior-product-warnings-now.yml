name: One-shot Interior Product Warning Patch

on:
  push:
    paths:
      - '.github/workflows/patch-interior-product-warnings-now.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python patch_interior_product_warnings.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add queue.json
          git commit -m "Polish flagged interior product copy"
          git pull --rebase origin main
          git push origin HEAD:main
