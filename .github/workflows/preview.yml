name: Rakuten Post Preview

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Preview mode'
        required: true
        default: 'samples'
        type: choice
        options:
          - samples
          - full-preview
          - preview
      count:
        description: 'Sample count (samples mode only)'
        required: true
        default: '5'
        type: choice
        options:
          - '3'
          - '5'
          - '10'

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build Rakuten post preview
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5-mini
        run: python main.py --mode "${{ inputs.mode }}" --count "${{ inputs.count }}"
